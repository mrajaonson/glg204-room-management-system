# The datasource is provided by the Testcontainers Postgres of PostgresTest (@ServiceConnection).

# The migrations live outside the classpath, next to the compose file.
spring.flyway.enabled=true
spring.flyway.locations=filesystem:./docker/flyway/migrations

# Same setting as production: the schema comes from Flyway, Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Placeholders for the settings normally read from .env; no mail is ever sent in tests.
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.mail.from=noreply@example.org
app.mail.validation-url=http://localhost:8080/api/accounts/validate

app.jwt.secret=test-secret-key-for-unit-tests-only-32-bytes-minimum
app.jwt.expiration=3600
